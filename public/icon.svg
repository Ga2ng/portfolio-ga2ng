<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180e30" />
      <stop offset="100%" stop-color="#080514" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#C4B5FD" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" stroke="rgba(124, 58, 237, 0.4)" stroke-width="12" />

  <!-- Inner Ambient Accent -->
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="rgba(168, 85, 247, 0.18)" stroke-width="4" />

  <!-- G2 Brand Text + Purple Dot -->
  <g transform="translate(256, 312)" text-anchor="middle">
    <text
      font-family="Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="205"
      letter-spacing="-10"
      fill="url(#textGrad)"
    >G2</text>
    <circle cx="150" cy="-125" r="32" fill="#a855f7" filter="url(#glow)" />
    <circle cx="150" cy="-125" r="22" fill="#e9d5ff" />
  </g>
</svg>
